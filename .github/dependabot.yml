version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    ignore:
      # Dependabot looks the name up on PyPI, where it is not published.
      - dependency-name: "overnightworks-*"
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: daily
