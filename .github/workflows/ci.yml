name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# The token can never push, whatever the repository's default says:
# a test that escapes its store fakes must not reach the live claim store.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - name: Verify the dependency lock
        run: uv lock --check
      - name: Check source
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Check types
        run: uv run --locked pyright src tests scripts
      - name: Check for dead code
        run: test -n "$(find src -name '*.py' -print -quit)" && uv run --locked vulture src scripts/vulture_whitelist.py --min-confidence 60
      - name: Check architecture contracts
        run: uv run --locked lint-imports
      - if: matrix.python != '3.12'
        run: uv run --locked pytest -n auto
      - if: matrix.python == '3.12'
        run: >-
          uv run --locked pytest -n auto --cov=aco --cov-branch
          --cov-report=xml:coverage.xml --cov-report=term-missing:skip-covered --cov-fail-under=100
      - if: ${{ !cancelled() && matrix.python == '3.12' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage
          path: coverage.xml

  # The same script gates release.yml, so CI proves exactly what a release
  # uploads: wheel and sdist carry the committed board assets and install
  # with no Node on PATH.
  package:
    name: Package smoke (wheel, sdist, tool install without Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: '3.11'
      - run: bash scripts/package_smoke.sh

  frontend:
    name: Frontend (svelte-check, lint, knip, vitest, assets fresh)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version-file: frontend/package.json
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check types
        run: pnpm check
      - name: Lint and formatting
        run: pnpm lint
      - name: Check for unused files, exports and dependencies
        run: pnpm knip
      - name: Tests with coverage
        run: pnpm test:coverage
      - name: Build into src/aco/board/static
        run: pnpm build
      # The board's assets are committed so a Python-only install needs no
      # Node; this gate proves the committed files are exactly what frontend/
      # builds. `git status --porcelain` also lists untracked and deleted
      # paths, which `git diff --exit-code` would miss.
      - name: Assets fresh
        working-directory: .
        run: |
          set -euo pipefail
          git ls-files --error-unmatch src/aco/board/static/index.html
          changed="$(git status --porcelain --untracked-files=all -- src/aco/board/static)"
          test -z "$changed" || { printf '%s\n' "$changed"; echo "::error::static assets differ from frontend/ build"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: frontend-coverage
          path: reports
          if-no-files-found: error

  e2e:
    name: E2E (Playwright, desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: '3.12'
      # The fake board server (tests/aco_board/e2e_server.py) the launcher
      # spawns is the only Python side this job needs; no Node is involved.
      - run: uv sync --locked --group dev
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version-file: frontend/package.json
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright's Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E specs (bootstrap, empty, unavailable, no-access -- desktop)
        working-directory: frontend
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
          if-no-files-found: ignore

  quality:
    needs: [check, package, frontend, e2e]
    if: always()
    permissions:
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/gate.yml@68f58fa1246c18d55674caecf361ab59b4ec13ed  # v0.6.0
    with:
      coverage-artifact: coverage
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
