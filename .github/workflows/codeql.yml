name: CodeQL

on:
  # Dependabot-triggered runs get a read-only token, but code scanning always
  # accepts uploads from pull_request runs, so Dependabot PRs get an analysis.
  # Avoid pull_request_target: executing untrusted PR code there can expose a privileged token.
  # https://docs.github.com/en/code-security/reference/code-scanning/troubleshoot-analysis-errors/resource-not-accessible
  pull_request:
    branches:
      - main
  # A merge queue needs a code scanning analysis of its merge group commit for
  # the code_scanning rule to pass there.
  merge_group:
    types:
      - checks_requested
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

# A newer push to a pull request cancels its older run; a push to main and the
# weekly run each get a group of their own and always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/codeql.yml@2d2b68bf3916b34f6f2c72a540c1e3d8a947b750 # v0.10.0
    with:
      languages: '["actions", "javascript-typescript", "python"]'
