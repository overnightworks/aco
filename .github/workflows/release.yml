name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: '3.14'
      # setup-uv only sets UV_PYTHON; the script's `uv python find` needs the interpreter present.
      - run: uv python install
      # Builds into dist/ and proves the distributions before they are uploaded.
      - run: bash scripts/package_smoke.sh dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.whl dist/*.tar.gz --generate-notes
