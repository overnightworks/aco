<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entscheidungs-Board v4</title>
<style>
:root{
  --bg:#F6F5F8; --surface:#FFFFFF; --surface-2:#F1EFF4; --line:#E5E2EA; --line-strong:#CDC8D5;
  --fg:#18151F; --fg-2:#4D4758; --fg-3:#6E6779;
  --accent:#7D2459; --accent-soft:#F6E9F1; --accent-fg:#FFFFFF;
  --good:#1C7350; --good-soft:#E4F2EA; --warn:#99570C; --warn-soft:#FBF0DE;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans",sans-serif;
  --mono:ui-monospace,"DejaVu Sans Mono",Menlo,Consolas,monospace;
  --fs-title:22px; --lh-title:28px; --fs-body:15px; --lh-body:22px;
  --fs-caption:13px; --lh-caption:18px; --fs-label:11px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --labw:136px; --listw:320px; --radius:10px; --frame-width:880px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#111015; --surface:#1A1820; --surface-2:#24222C; --line:#2E2B37; --line-strong:#443F50;
  --fg:#EDEBF2; --fg-2:#B9B3C4; --fg-3:#958EA1; --accent:#EE93C6; --accent-soft:#35202D; --accent-fg:#1B0E16;
  --good:#63CB98; --good-soft:#15291F; --warn:#E9B25E; --warn-soft:#2E2415; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#111015; --surface:#1A1820; --surface-2:#24222C; --line:#2E2B37; --line-strong:#443F50;
  --fg:#EDEBF2; --fg-2:#B9B3C4; --fg-3:#958EA1; --accent:#EE93C6; --accent-soft:#35202D; --accent-fg:#1B0E16;
  --good:#63CB98; --good-soft:#15291F; --warn:#E9B25E; --warn-soft:#2E2415; color-scheme:dark; }

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:400 var(--fs-body)/var(--lh-body) var(--font);
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- header ---------- */
.top{height:56px;display:flex;align-items:center;gap:var(--s4);padding:0 var(--s5);
  background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:var(--s2);font-weight:650;white-space:nowrap}
.draft{font-size:var(--fs-caption);color:var(--fg-3);white-space:nowrap}
.nav{margin-left:auto;display:flex;align-items:center;gap:var(--s1)}
.nav button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:550;color:var(--fg-2);
  display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.nav button .n{font-size:var(--fs-caption);color:var(--fg-3)}
.nav button[aria-current="page"]{background:var(--fg);color:var(--surface)}
.nav button[aria-current="page"] .n{color:inherit;opacity:.75}
.nav .mit{margin-left:var(--s2);border:1px solid var(--line-strong)}

/* ---------- two panes ---------- */
.app{display:grid;grid-template-columns:var(--listw) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:calc(100vh - 56px)}
.list{grid-column:1;grid-row:1 / span 2;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:var(--s2) 0 var(--s5)}
.strips{grid-column:2;grid-row:1;min-width:0;display:flex;flex-direction:column;gap:var(--s2);max-height:35vh;overflow:auto}
.strips:has(.strip){padding:var(--s5) var(--s6) var(--s4)}
.pane{grid-column:2;grid-row:2;overflow:auto;padding:var(--s5) var(--s6) 0}
.strips:has(.strip) + .pane{padding-top:0}
.inner{max-width:var(--frame-width);margin:0 auto;padding-bottom:var(--s6)}

/* ---------- list ---------- */
.grp{display:flex;justify-content:space-between;align-items:baseline;padding:var(--s4) var(--s5) var(--s1)}
.lbl,.grp{font-size:var(--fs-label);font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.row{display:flex;align-items:center;gap:var(--s3);width:100%;border:0;background:none;text-align:left;
  padding:7px var(--s5);min-height:36px}
.row:hover{background:var(--surface-2)}
.row[aria-current="true"]{background:var(--surface-2);font-weight:600}
.row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.muted .t{color:var(--fg-3)}
.shape{flex:none;width:14px;height:14px;display:block}
.none{padding:var(--s4) var(--s5) 0;font-size:var(--fs-caption);color:var(--fg-3)}
.empty{padding:var(--s6) var(--s5);color:var(--fg-2)}
.empty b{display:block;color:var(--fg);margin-bottom:var(--s1)}

/* ---------- meta zone (outside the card) ---------- */
.meta{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 var(--s2);font-size:var(--fs-caption);
  line-height:var(--lh-caption);color:var(--fg-3);margin:0 0 var(--s2) 2px}
.meta .sep{opacity:.6}
.meta .props{display:inline-flex;flex-wrap:wrap;gap:0 var(--s2)}
.meta .final{color:var(--warn);font-weight:600}
.hback{display:none}

/* ---------- decision zone (the card) ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:var(--s5) var(--s6) var(--s6)}
.card h1{font-size:var(--fs-title);line-height:var(--lh-title);font-weight:650;margin:0 0 var(--s5);letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:var(--labw) minmax(0,1fr);column-gap:var(--s5);row-gap:var(--s4);align-items:start}
.grid>.lab,.sub>.lab{grid-column:1}
.grid>.val,.sub>.val{grid-column:2;min-width:0}
.lab{font-size:var(--fs-label);line-height:var(--lh-body);font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.lab.in{padding-left:var(--s3);font-weight:550}
.p{margin:0}
.gap{color:var(--fg-3);font-style:italic}
.cap{font-size:var(--fs-caption);line-height:var(--lh-caption);color:var(--fg-2);margin:var(--s2) 0 0}
.sub{grid-column:1/-1;display:grid;grid-template-columns:subgrid;row-gap:var(--s3);align-items:start}

/* options */
.opts{grid-column:1/-1;display:grid;grid-template-columns:subgrid;row-gap:0}
.opt{grid-column:1/-1;display:grid;grid-template-columns:subgrid;row-gap:var(--s3)}
.opt+.opt>.ohead{border-top:1px solid var(--line);border-radius:0;margin-top:var(--s2);padding-top:var(--s3)}
.ohead{grid-column:2;display:grid;grid-template-columns:24px minmax(0,1fr) 16px;column-gap:var(--s3);
  align-items:start;text-align:left;border:0;background:none;padding:var(--s1) 0;border-radius:6px}
.ohead:hover .nm{text-decoration:underline;text-underline-offset:3px}
.ohead .nm{font-weight:600;display:block}
.ohead .ef{display:block;color:var(--fg-2)}
.chev{width:16px;height:16px;margin-top:3px;color:var(--fg-3);transition:transform .15s}
.ohead[aria-expanded="true"] .chev{transform:rotate(180deg)}
.letter{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;
  font-size:var(--fs-caption);font-weight:700;line-height:1;margin-top:-1px;color:var(--fg-2)}
.letter.rec{border-color:var(--accent);color:var(--accent)}
.letter.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.opt.open .ohead .nm{text-decoration:none}
.same{display:inline-flex;align-items:center;gap:var(--s2);font-size:var(--fs-caption);font-weight:650;
  letter-spacing:.04em;color:var(--fg-2);border:1.5px dashed var(--line-strong);border-radius:6px;padding:2px 10px}
.undo b{font-weight:600}
.undo b.final{color:var(--warn)}
details.contract summary{cursor:pointer;color:var(--fg-2);list-style:none;display:inline-flex;align-items:center;gap:6px}
details.contract summary::-webkit-details-marker{display:none}
details.contract summary::before{content:"";width:0;height:0;border-left:5px solid currentColor;border-top:4px solid transparent;
  border-bottom:4px solid transparent;transition:transform .15s}
details.contract[open] summary::before{transform:rotate(90deg)}
.bind{margin:var(--s2) 0 0;font-size:var(--fs-caption);line-height:var(--lh-caption);color:var(--fg-2);
  border-left:2px solid var(--line-strong);padding-left:var(--s3)}
.bind .src{display:block;margin-top:var(--s2);font-family:var(--mono);font-size:12px;color:var(--fg-3)}

/* recommendation */
.recv{display:flex;align-items:start;gap:var(--s3)}

/* decide */
.decide{grid-column:1/-1;display:grid;grid-template-columns:subgrid;border-top:1px solid var(--line);padding:var(--s4) 0 var(--s2);
  margin-top:var(--s1);position:sticky;bottom:0;background:var(--surface);z-index:2}
.dbar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2)}
.pick{min-width:48px;height:40px;border-radius:8px;border:1.5px solid var(--line-strong);background:var(--surface);
  font-weight:700;padding:0 var(--s3)}
.pick:hover{border-color:var(--fg-2)}
.pick.rec{border-color:var(--accent);color:var(--accent)}
.pick.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.quiet{height:40px;border:0;background:none;color:var(--fg-2);font-weight:500;padding:0 var(--s3);border-radius:8px}
.quiet:hover,.quiet[aria-expanded="true"]{background:var(--surface-2);color:var(--fg)}
.dbar .sp{flex:1}
.note{margin-top:var(--s3);display:grid;gap:var(--s2)}
.note textarea{width:100%;min-height:72px;resize:vertical;border:1px solid var(--line-strong);border-radius:8px;
  padding:var(--s2) var(--s3);background:var(--surface)}
.note .acts{display:flex;gap:var(--s2);justify-content:flex-end}
.btn{height:40px;border-radius:8px;border:1.5px solid var(--fg);background:var(--fg);color:var(--surface);font-weight:600;padding:0 var(--s4)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.alt{background:none;color:var(--fg);border-color:var(--line-strong)}

/* strip after deciding */
.strip{display:flex;align-items:center;gap:var(--s3);background:var(--good-soft);color:var(--fg);border-radius:var(--radius);
  padding:var(--s2) var(--s2) var(--s2) var(--s4);width:100%;max-width:var(--frame-width);margin-inline:auto}
.strip .ic{color:var(--good)}
.strip .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip.back{background:var(--surface-2)}
.strip.back .ic{color:var(--fg-3)}

/* group decisions */
.pts{grid-column:1/-1;display:grid;grid-template-columns:subgrid;row-gap:0}
.pt{grid-column:1/-1;display:grid;grid-template-columns:subgrid;row-gap:var(--s3);padding:0}
.pt+.pt>.phead{border-top:1px solid var(--line);padding-top:var(--s2);margin-top:var(--s2)}
.phead{grid-column:2;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:var(--s3)}
.ptog{display:grid;grid-template-columns:20px minmax(0,1fr);column-gap:var(--s2);align-items:start;text-align:left;
  border:0;background:none;padding:2px 0;min-width:0}
.ptog .q .chev-wrap{display:inline-flex;vertical-align:-3px;margin-left:4px}
.ptog:hover .q{text-decoration:underline;text-underline-offset:3px}
.fin{display:inline-flex;color:var(--warn);margin-left:6px;vertical-align:-1px}
.ptog .no{font-weight:700;color:var(--fg-3)}
.ptog .q{font-weight:600}
.ptog .rv{display:block;color:var(--fg-2);font-weight:400;font-size:var(--fs-caption);line-height:var(--lh-caption)}
.ptog[aria-expanded="true"] .chev{transform:rotate(180deg)}
.picks{display:flex;gap:6px}
.picks .pick{min-width:40px;height:32px}
.pt.open{background:none}
.pt.open>.inset{grid-column:1/-1;display:grid;grid-template-columns:subgrid;row-gap:var(--s3);padding:var(--s1) 0 var(--s2)}

/* agent and decided cards */
.chip{display:inline-flex;align-items:center;gap:var(--s2);font-weight:600}

/* ---------- pictures ---------- */
.fig{max-width:100%}
.flow{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,150px);column-gap:22px;justify-content:start}
.flow li{position:relative;display:flex;align-items:center;gap:6px;min-height:34px;padding:6px 10px;
  border:1.5px solid var(--line-strong);border-radius:8px;background:var(--surface);font-size:var(--fs-caption);
  line-height:16px;font-weight:550;color:var(--fg)}
.flow li+li::before{content:"";position:absolute;left:-19px;top:50%;width:14px;height:1.5px;background:var(--fg-3)}
.flow li+li::after{content:"";position:absolute;left:-9px;top:calc(50% - 3.5px);border-left:5px solid var(--fg-3);
  border-top:4.25px solid transparent;border-bottom:4.25px solid transparent}
.actor{width:16px;height:16px;flex:none;fill:var(--fg-3)}
.actor .hole,.actor .cut{fill:none;stroke:var(--surface);stroke-width:1.5;stroke-linecap:round}
.actor .hole{fill:var(--surface);stroke:none}
.st .mk{font-weight:700;margin-left:2px}
.flow .mk{position:absolute;top:-8px;right:-8px;width:17px;height:17px;margin:0;border-radius:50%;display:grid;place-items:center;
  font-size:10px;line-height:1;background:var(--surface);border:1.5px solid currentColor}
.flow li span{min-width:0}
.st.ok .mk{color:var(--good)}
.st.bad .mk{color:var(--warn)}
.st.q{border-style:dashed;color:var(--fg-3)}
.st.q .mk{display:none}
.st.dash{border-style:dashed;color:var(--fg-3);background:none}
.st.hi{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
.st.hi .actor{fill:var(--accent)}
.scr{display:inline-block;min-width:300px;max-width:100%;border:1.5px solid var(--line-strong);border-radius:10px;
  background:var(--surface);padding:var(--s2);font-size:var(--fs-caption);line-height:16px}
.scr-t{margin:0 0 6px;padding:2px 4px;font-weight:650;color:var(--fg-2)}
.scr ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.scr li{display:flex;justify-content:space-between;gap:var(--s4);padding:6px 10px;border:1.5px solid var(--line);border-radius:6px;font-weight:550}
.scr li .r{color:var(--fg-2);white-space:nowrap}
.scr li .r.path{font-family:var(--mono);font-size:12px}
.scr li.hi .r{color:var(--accent);font-weight:700}
.scr li.st.dash{border-style:dashed}
.scr-note{margin:6px 4px 0;color:var(--fg-3)}
.ba{display:flex;align-items:center;gap:var(--s3)}
.ba figure{margin:0;display:grid;gap:4px;justify-items:start}
.ba figcaption{font-size:var(--fs-caption);line-height:var(--lh-caption);color:var(--fg-3)}
.ba-arrow{color:var(--fg-3);font-size:18px;padding-bottom:18px}
.frame{display:block;max-width:100%;height:auto}
.frame text{font:600 11px var(--font)}
.frame .t{fill:var(--fg)} .frame .t2{fill:var(--fg-3)} .frame .tl{fill:var(--fg-2);text-decoration:underline}
.frame .th{fill:var(--accent)} .frame .tb{fill:var(--warn)}
.f-scr{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.5}
.f-box{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.2}
.f-soft{fill:var(--surface-2)}
.f-dash{fill:none;stroke:var(--line-strong);stroke-width:1.2;stroke-dasharray:4 3}
.f-bad{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.2;stroke-dasharray:5 3}
.f-hi{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.f-mark{fill:var(--surface);stroke:var(--accent);stroke-width:1.5}
.f-cursor{fill:var(--fg);stroke:var(--surface);stroke-width:1.2}
.thumb{display:none}

/* ---------- Mitsprache ---------- */
.mtab{width:100%;border-collapse:collapse;font-size:var(--fs-caption);table-layout:fixed}
.mtab th:first-child{width:128px}
.mtab th{font-size:var(--fs-label);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:650;text-align:left;
  padding:0 var(--s1) var(--s2);vertical-align:bottom}
.mtab td{padding:3px var(--s1);border-top:1px solid var(--line)}
.mtab td.pr{font-weight:600;font-size:var(--fs-body);padding-right:var(--s3);white-space:nowrap}
.cell{width:100%;height:30px;border-radius:6px;border:1.5px solid var(--line);background:none;display:flex;align-items:center;
  justify-content:center;gap:5px;font-weight:600;color:var(--fg-2)}
.cell.ag{border-style:dashed;border-color:var(--line-strong);color:var(--fg-3)}
.legend{display:flex;gap:var(--s5);font-size:var(--fs-caption);color:var(--fg-2);margin:0 0 var(--s4)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* ---------- dialogs ---------- */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);padding:var(--s5);max-width:min(420px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,8,14,.45)}
dialog h2{font-size:var(--fs-body);margin:0 0 var(--s2)}
dialog p{margin:0 0 var(--s4);color:var(--fg-2)}
dialog .acts{display:flex;gap:var(--s2);justify-content:flex-end}
dialog.big{max-width:calc(100vw - 32px);padding:var(--s4)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- shapes, small parts ---------- */
.shape-wrap{display:inline-flex;flex:none}
.s-open{color:var(--fg-2)} .s-blocks{color:var(--accent)} .s-todo,.s-back,.s-agent{color:var(--fg-3)}
.s-done{color:var(--good)} .s-over{color:var(--accent)}
.warnmark{display:inline-flex;vertical-align:-1px;margin-right:4px}
.lnk{border:0;background:none;padding:0;color:var(--fg);text-decoration:underline;text-underline-offset:3px;font-weight:550}
.count{font-size:var(--fs-caption);color:var(--fg-3);margin-left:var(--s2)}
.pick.wide{padding:0 var(--s4);font-weight:600}
.foot{margin-top:var(--s4)}
.figwrap{display:grid;justify-items:start}
.fig{display:block;border:0;background:none;padding:0;cursor:zoom-in;text-align:left}
.chev-wrap{display:flex}
.dot{width:9px;height:9px;border-radius:50%;background:var(--fg-2);display:inline-block}
.gear{display:inline-flex}
.zfig{overflow:auto;max-height:70vh;margin-bottom:var(--s3)}
.zfig .flow{flex-direction:column;align-items:flex-start;gap:18px}
.opt .ba .before{opacity:.45}
.decide.stuck{box-shadow:0 -12px 14px -14px rgba(0,0,0,.28)}
.cell .kd{display:none}
.draftchip{display:none}

/* ---------- phone ---------- */
@media (max-width:760px){
  .top{height:52px;padding:0 var(--s4);gap:var(--s2)}
  .brand,.draft{display:none}
  .draftchip{display:inline-block;font-size:var(--fs-caption);color:var(--fg-3);border:1px dashed var(--line-strong);
    border-radius:6px;padding:1px 6px;white-space:nowrap}
  .nav{margin-left:auto;gap:2px}
  .nav button{padding:6px 8px}
  .nav .mit{margin-left:var(--s1);padding:6px 9px}
  .nav .mitl{display:none}
  .app{grid-template-columns:1fr;height:calc(100vh - 52px)}
  .app:not(.card-view) .pane,.app.card-view .list{display:none}
  .list,.strips,.pane{grid-column:1}
  .list{grid-row:2;border-right:0}
  .strips{background:var(--surface)}
  .strips:has(.strip){padding:var(--s3) var(--s4) var(--s4)}
  .grp,.row{padding-left:var(--s4);padding-right:var(--s4)}
  .pane{padding:var(--s3) var(--s4) 0;background:var(--surface)}
  .inner{padding-bottom:var(--s4)}
  body.card-view .hback{display:inline-flex;border:0;background:none;padding:6px 8px 6px 0;color:var(--fg);font-weight:600;white-space:nowrap}
  body.card-view .nav button:not(.mit){display:none}
  .count{display:none}
  .meta{margin-bottom:var(--s3);display:block}
  .meta .where,.meta .props{display:flex}
  .meta .sep.lead{display:none}
  .card{border:0;border-radius:0;padding:0;background:none}
  .card h1{font-size:20px;line-height:26px;margin-bottom:var(--s4)}
  .grid{grid-template-columns:minmax(0,1fr);row-gap:var(--s3)}
  .grid .lab,.grid .val,.sub>.lab,.sub>.val{grid-column:1}
  .lab{line-height:16px}
  .lab.in{padding-left:0}
  .ohead,.phead{grid-column:1}
  .decide{padding-top:var(--s3)}
  .today .fig{zoom:.5}
  .today .fig::after{content:"⤢";position:absolute;right:4px;bottom:2px;font-size:22px;color:var(--fg-3)}
  .today .fig{position:relative;border:1px solid var(--line);border-radius:8px;padding:6px}
  .flow{grid-auto-columns:minmax(0,1fr)}
  .opt .flow,.zfig .flow{grid-auto-flow:row;grid-auto-columns:auto;row-gap:18px;justify-content:stretch}

}

function recRow(p, cls) {
  if (p.rec === null || p.rec === undefined) return [lab("Recommendation", cls), val(gapText())];
  return [lab("Recommendation", cls), val(h("div", {class: "recv"}, letter(p.rec, "rec"), h("p", {class: "p"}, p.reason)))];
}

// ---------- the open card ----------
function singleCard(c) {
  const p = c.points[0];
  const g = h("div", {class: "grid"}, lab("Problem"), val(para(p.problem)), ...todayRow(p), optionsBlock(c, p, 0),
    ...recRow(p), decideRow(c));
  return h("article", {class: "card", "aria-label": c.title}, h("h1", null, c.title), g);
}

function decideRow(c) {
  const p = c.points[0], bar = h("div", {class: "dbar"});
  p.options.forEach((o, i) => bar.append(h("button", {type: "button", class: "pick" + (p.rec === i ? " rec" : ""),
    "aria-label": "Decide " + LETTERS[i] + ": " + o.name, onclick: () => choose(c, 0, i)}, LETTERS[i])));
  if (p.options.length) bar.append(h("span", {class: "sp"}));
  bar.append(...escapes(c));
  return h("div", {class: "decide"}, lab("Decide"), val(bar, notePanel(c)));
}

function escapes(c) {
  const panel = S.panel.get(c.ref);
  const toggle = k => () => { S.panel.set(c.ref, panel === k ? null : k); render(); const t = $("note"); if (t) t.focus(); };
  return [h("button", {type: "button", class: "quiet", "aria-expanded": String(panel === "other"), onclick: toggle("other")}, "Other…"),
    h("button", {type: "button", class: "quiet", "aria-expanded": String(panel === "unclear"), onclick: toggle("unclear")}, "Unclear")];
}

function notePanel(c) {
  const panel = S.panel.get(c.ref);
  if (!panel) return null;
  const other = panel === "other", draftKey = c.ref + "|" + panel;
  const ta = h("textarea", {id: "note", "aria-label": other ? "Your answer" : "What is unclear? (optional)",
    placeholder: other ? "What should apply instead?" : "Optional: what is unclear?",
    oninput: () => { S.drafts.set(draftKey, ta.value); send.disabled = other && !ta.value.trim(); }});
  ta.value = S.drafts.get(draftKey) || "";
  const send = h("button", {type: "button", class: "btn", disabled: other && !ta.value.trim(),
    onclick: () => other ? decideOther(c, ta.value.trim()) : sendBack(c, ta.value.trim())}, "Send");
  return h("div", {class: "note"}, ta, h("div", {class: "acts"}, send));
}

// ---------- group decisions ----------
function picksOf(c) {
  if (!S.picks.has(c.ref)) S.picks.set(c.ref, c.points.map(() => null));
  return S.picks.get(c.ref);
}
const pickOf = (c, pi) => c.group ? picksOf(c)[pi] : null;
// A group opens no point by itself: the rows are the overview, a click opens one point at a time.
const openPointOf = c => S.openPt.has(c.ref) ? S.openPt.get(c.ref) : null;

function groupCard(c) {
  const vis = mine(c), main = vis.filter(i => i < c.main), more = vis.filter(i => i >= c.main);
  const g = h("div", {class: "grid"}, lab("Problem"), val(para(c.problem)));
  if (main.length) g.append(pointsBlock(c, vis, main, "Points"));
  if (more.length) g.append(pointsBlock(c, vis, more, "More points"));
  g.append(groupDecide(c, vis));
  const hidden = c.points.length - vis.length;
  return h("article", {class: "card", "aria-label": c.title}, h("h1", null, c.title), g,
    hidden ? h("p", {class: "cap foot"}, hidden + " more points go to the agent. ",
      h("button", {type: "button", class: "lnk", onclick: () => { S.tab = "agent"; select(c.ref + "|agent"); }}, "Show")) : null);
}

function pointsBlock(c, vis, idxs, label) {
  const open = openPointOf(c), picks = picksOf(c), box = h("div", {class: "pts"});
  idxs.forEach((pi, k) => {
    const p = c.points[pi], isOpen = open === pi, n = vis.indexOf(pi) + 1, more = pi >= c.main;
    const final = p.options.some(isFinal);
    const toggle = h("button", {type: "button", class: "ptog", "aria-expanded": String(isOpen),
        onclick: () => { S.openPt.set(c.ref, isOpen ? null : pi); render(); }},
      h("span", {class: "no"}, String(n)),
      h("span", {class: "qwrap"}, h("span", {class: "q"}, p.title, final ? h("span", {class: "fin", title: "One option is final"}, warnMark()) : null, chevron()),
        more && p.rec !== null ? h("span", {class: "rv"}, LETTERS[p.rec] + " · " + p.options[p.rec].name) : null));
    const choices = h("div", {class: "picks", role: "group", "aria-label": "Point " + n},
      p.options.map((o, i) => h("button", {type: "button",
        class: "pick" + (picks[pi] === i ? " sel" : p.rec === i ? " rec" : ""), "aria-pressed": String(picks[pi] === i),
        "aria-label": "Point " + n + ": " + LETTERS[i] + " – " + o.name, onclick: () => choose(c, pi, i)}, LETTERS[i])));
    const row = h("div", {class: "pt" + (k === 0 ? " first" : "") + (isOpen ? " open" : "")},
      lab(k === 0 ? label : ""), h("div", {class: "phead"}, toggle, choices));
    if (isOpen) row.append(h("div", {class: "inset"}, lab("Problem", "in"), val(para(p.problem)), ...todayRow(p, "in"),
      optionsBlock(c, p, pi, "in"), ...recRow(p, "in")));
    box.append(row);
  });
  return box;
}

function groupDecide(c, vis) {
  const picks = picksOf(c), done = vis.filter(i => picks[i] !== null).length;
  const bar = h("div", {class: "dbar"},
    h("button", {type: "button", class: "pick rec wide", "aria-label": "Accept all recommendations",
      onclick: () => acceptAll(c, vis)}, "Accept all"),
    h("span", {class: "count"}, done + " of " + vis.length + " chosen"), h("span", {class: "sp"}), ...escapes(c));
  return h("div", {class: "decide"}, lab("Decide"), val(bar, notePanel(c)));
}

// ---------- agent decided ----------
function agentCard(x) {
  const c = x.card, key = x.ref, idx = theirs(c), kinds = [...new Set(idx.map(i => c.points[i].kind))];
  const chose = idx.map(i => {
    const p = c.points[i], o = p.rec !== null ? p.options[p.rec] : null;
    if (!o) return h("p", {class: "p"}, idx.length > 1 ? p.title + " – " : "", "Ja (default)");
    return h("div", {class: "recv"}, letter(p.rec, "sel"), h("p", {class: "p"}, h("b", null, o.name),
      o.notice ? h("span", {class: "ef"}, o.notice) : null));
  });
  const binding = idx.map(i => { const p = c.points[i], o = p.rec !== null ? p.options[p.rec] : null;
    return h("p", {class: "p"}, (o && o.contract) || p.shared); });
  const over = S.overruled.get(key), editing = S.objOpen.has(key);
  let act;
  if (over) act = h("p", {class: "p"}, h("b", null, "Overruled: "), "„" + over + "“");
  else if (editing) {
    const ta = h("textarea", {id: "note", "aria-label": "What should apply instead?", placeholder: "What should apply instead?",
      oninput: () => { send.disabled = !ta.value.trim(); }});
    const send = h("button", {type: "button", class: "btn", disabled: true,
      onclick: () => { S.overruled.set(key, ta.value.trim()); S.objOpen.delete(key); render(); }}, "Send");
    act = h("div", {class: "note"}, ta, h("div", {class: "acts"}, send));
  } else act = h("div", {class: "dbar"}, h("button", {type: "button", class: "pick wide",
    onclick: () => { S.objOpen.add(key); render(); const t = $("note"); if (t) t.focus(); }}, "Overrule"));
  const g = h("div", {class: "grid"}, lab("Agent chose"), val(...chose),
    lab("Why"), val(h("p", {class: "p"}, "Mitsprache: " + c.project + " · " + kinds.join(", ") + " → Agent. ",
      h("button", {type: "button", class: "lnk", onclick: openMit}, "Change"))),
    lab("Contract"), val(h("details", {class: "contract"}, h("summary", null, "Show"),
      h("div", {class: "bind"}, ...binding, h("span", {class: "src"}, c.points[idx[0]].source)))),
    h("div", {class: "decide"}, lab("Decide"), val(act)));
  return [meta(c, [kinds.join(" · "), "agent decided"]),
    h("article", {class: "card", "aria-label": c.title}, h("h1", null, c.title), g)];
}

// ---------- decided ----------
function decidedCard(x) {
  const mineDecided = S.decided.get(x.ref), c = x;
  if (!mineDecided) {
    const g = h("div", {class: "grid"}, lab("Decided"), val(h("div", {class: "recv"}, shape("done"), h("p", {class: "p"}, x.answer))),
      lab("How"), val(para((x.how === "board" ? "Board" : "From chat") + " · " + fmtDate(x.date))),
      lab("Contract"), val(h("details", {class: "contract"}, h("summary", null, "Show"),
        h("div", {class: "bind"}, h("p", {class: "p"}, x.text), h("span", {class: "src"}, x.source)))));
    return [meta(x, [x.kind]), h("article", {class: "card"}, h("h1", null, x.title), g)];
  }
  const d = mineDecided;
  const g = h("div", {class: "grid"}, lab("Decided"), val(...d.lines.map(t => h("p", {class: "p"}, t))),
    lab("How"), val(para("Board · today")),
    lab("Contract"), val(h("details", {class: "contract"}, h("summary", null, "Show"),
      h("div", {class: "bind"}, ...d.contracts.map(t => h("p", {class: "p"}, t)),
        h("span", {class: "src"}, c.points.length > 1 ? c.project + " · Item " + c.item : c.points[0].source),
        h("span", {class: "src"}, "Card " + d.hash)))));
  return [meta(c, [c.kinds.join(" · ")]), h("article", {class: "card"}, h("h1", null, c.title), g)];
}

// ---------- Mitsprache ----------
function mitView() {
  const head = h("tr", null, h("th", null, ""), DATA.kinds.map(k => h("th", {scope: "col"}, k)));
  const rows = DATA.repos.map(r => h("tr", null, h("td", {class: "pr"}, r), DATA.kinds.map(k => {
    const ag = S.mit[r][k] === "agent";
    return h("td", null, h("button", {type: "button", class: "cell" + (ag ? " ag" : ""), "aria-pressed": String(ag),
      "aria-label": r + " · " + k + ": " + (ag ? "Agent decides" : "You decide"),
      onclick: () => { S.mit[r][k] = ag ? "you" : "agent"; render(); }},
      h("span", {class: "kd"}, k), h("span", {class: "cv"}, ag ? shape("agent") : h("span", {class: "dot", "aria-hidden": "true"}), ag ? "Agent" : "You")));
  })));
  return h("article", {class: "card mitcard"}, h("h1", null, "Mitsprache"),
    h("div", {class: "legend"}, h("span", null, h("span", {class: "dot"}), "You decide"),
      h("span", null, shape("agent"), "Agent decides, you can overrule")),
    h("div", {class: "mwrap"}, h("table", {class: "mtab"}, h("thead", null, head), h("tbody", null, rows))));
}

// ---------- actions ----------
function confirmFinal(title, consequence, verb) {
  const dlg = $("confirm");
  return new Promise(resolve => {
    const close = ok => { dlg.close(); resolve(ok); };
    const lines = [].concat(consequence).map(t => h("p", {class: "cline"}, warnMark(), h("span", null, t)));
    dlg.replaceChildren(h("h2", {id: "confirm-title"}, title), h("div", {class: "clines"}, lines),
      h("div", {class: "acts"}, h("button", {type: "button", class: "btn alt", onclick: () => close(false)}, "Cancel"),
        h("button", {type: "button", class: "btn", onclick: () => close(true)}, verb)));
    dlg.onclose = () => resolve(false);
    dlg.showModal();
  });
}
const isFinal = o => o.undo && o.undo[0] === "final";
// The undo text continues "final — …"; standing alone in the confirm it starts as a sentence.
const consequenceOf = o => o.undo[1].charAt(0).toUpperCase() + o.undo[1].slice(1);

async function choose(c, pi, i) {
  const p = c.points[pi], o = p.options[i];
  const what = (c.group ? "Point " + (mine(c).indexOf(pi) + 1) + ": " : "") + consequenceOf(o);
  if (isFinal(o) && !(await confirmFinal("Decide " + LETTERS[i] + "?", what, "Decide " + LETTERS[i]))) return;
  if (!c.group) return decide(c, [i]);
  const picks = picksOf(c), vis = mine(c);
  picks[pi] = i;
  if (vis.every(k => picks[k] !== null)) return decide(c, picks);
  if (openPointOf(c) === pi) S.openPt.set(c.ref, vis.find(k => picks[k] === null) ?? null);
  render();
}

async function acceptAll(c, vis) {
  const finals = vis.filter(i => isFinal(c.points[i].options[c.points[i].rec]));
  if (finals.length) {
    const lines = finals.map(i => "Point " + (vis.indexOf(i) + 1) + ": " + consequenceOf(c.points[i].options[c.points[i].rec]));
    if (!(await confirmFinal("Accept all recommendations?", lines, "Accept all"))) return;
  }
  const picks = picksOf(c);
  vis.forEach(i => { picks[i] = c.points[i].rec; });
  decide(c, picks);
}

function hashOf(text) {
  let x = 2166136261;
  for (const ch of text) { x ^= ch.codePointAt(0); x = Math.imul(x, 16777619) >>> 0; }
  return x.toString(16).padStart(8, "0");
}

function decide(c, picks) {
  const vis = c.group ? mine(c) : [0];
  const lines = vis.map((pi, n) => {
    const o = c.points[pi].options[picks[pi]];
    return (c.group ? n + 1 + " · " : "") + LETTERS[picks[pi]] + " — " + o.name;
  });
  const contracts = vis.map(pi => c.points[pi].options[picks[pi]].contract || c.points[pi].shared);
  const short = c.group ? vis.map((pi, n) => n + 1 + LETTERS[picks[pi]]).join(" ") : lines[0];
  record(c, {lines, contracts, hash: hashOf(JSON.stringify(c))}, "Decided: " + short);
}
function decideOther(c, text) {
  S.panel.delete(c.ref);
  record(c, {lines: ["Other: „" + text + "“"], contracts: [text], hash: hashOf(JSON.stringify(c))}, "Decided: Other");
}
function record(c, entry, stripText) {
  S.decided.set(c.ref, entry);
  S.back.delete(c.ref);
  S.strip = {ref: c.ref, text: stripText + " · " + c.topic, kind: "done"};
  S.sel = nextOpen(); S.tab = "open"; S.view = "card";
  render();
}
function sendBack(c, note) {
  S.panel.delete(c.ref);
  S.back.set(c.ref, note);
  S.strip = {ref: c.ref, text: "With head: " + c.topic, kind: "back"};
  S.sel = nextOpen() || c.ref;
  render();
}
function undoDecision(key) {
  S.decided.delete(key); S.back.delete(key);
  const c = cardByKey(key);
  if (c.group) S.picks.delete(key);
  S.strip = null; S.tab = "open"; S.view = "card"; S.sel = key;
  render();
}

// ---------- page ----------
function go(tab) { S.tab = tab; S.view = "card"; S.sel = firstOf(tab); S.phoneCard = false; S.strip = null; render(); }
function select(key) { S.sel = key; S.view = "card"; S.phoneCard = true; S.strip = null; render(); $("pane").scrollTop = 0; }
function toList() { S.phoneCard = false; render(); }
function openMit() { S.view = "mit"; S.phoneCard = true; render(); }
function zoom(fig, caption) {
  const dlg = $("zoom");
  dlg.replaceChildren(h("div", {class: "zfig", html: fig}), h("p", {class: "cap"}, caption),
    h("div", {class: "acts"}, h("button", {type: "button", class: "btn alt", onclick: () => dlg.close()}, "Close")));
  dlg.showModal();
}

function renderNav() {
  const tab = (id, label) => h("button", {type: "button", "aria-current": S.view === "card" && S.tab === id ? "page" : null,
    onclick: () => go(id)}, label, h("span", {class: "n"}, String(listFor(id).length)));
  $("nav").replaceChildren(tab("open", "Open"), tab("decided", "Decided"), tab("agent", "Agent"),
    h("button", {type: "button", class: "mit", "aria-current": S.view === "mit" ? "page" : null, "aria-label": "Mitsprache",
      onclick: openMit}, h("span", {class: "gear", "aria-hidden": "true", html: '<svg viewBox="0 0 16 16" width="15" height="15"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="5" cy="4" r="1.9" fill="var(--surface)" stroke="currentColor" stroke-width="1.4"/><circle cx="11" cy="8" r="1.9" fill="var(--surface)" stroke="currentColor" stroke-width="1.4"/><circle cx="7" cy="12" r="1.9" fill="var(--surface)" stroke="currentColor" stroke-width="1.4"/></svg>'}),
      h("span", {class: "mitl"}, "Mitsprache")));
}

function row(x) {
  const c = x.card || x, key = x.ref;
  let k, muted = false;
  if (S.tab === "open") { k = stateOf(c); muted = k === "todo" || k === "back"; }
  else k = S.tab === "agent" ? (S.overruled.has(key) ? "overruled" : "agent") : "done";
  return h("button", {type: "button", class: "row" + (muted ? " muted" : ""), title: c.title,
    "aria-current": S.view === "card" && S.sel === key ? "true" : "false", onclick: () => select(key)},
    shape(k), h("span", {class: "t"}, c.topic));
}

function renderList() {
  const items = ordered(S.tab), kids = [], quiet = [];
  for (const repo of DATA.repos) {
    const rows = items.filter(x => projectOf(x) === repo);
    if (!rows.length) { quiet.push(repo); continue; }
    kids.push(h("div", {class: "grp"}, h("span", null, repo), h("span", null, String(rows.length))));
    rows.forEach(x => kids.push(row(x)));
  }
  if (!items.length) kids.push(emptyState());
  else if (S.tab === "open" && quiet.length) kids.push(h("p", {class: "none"}, "Nothing open: " + quiet.join(" · ")));
  $("list").replaceChildren(...kids);
}

function emptyState() {
  const [t, s] = S.tab === "decided" ? ["Nothing decided yet", "Your decisions show here with their answer and date."]
    : S.tab === "agent" ? ["The agent decided nothing", "Points you leave to the agent in Mitsprache show here."]
    : ["All decided", "No project is waiting for you."];
  return h("div", {class: "empty"}, h("b", null, t), s);
}

function strip() {
  if (!S.strip) return null;
  const s = S.strip;
  return h("div", {class: "strip " + s.kind, role: "status"}, shape(s.kind === "done" ? "done" : "back"),
    h("span", {class: "tx"}, s.text), h("button", {type: "button", class: "quiet", onclick: () => undoDecision(s.ref)}, "Undo"));
}

function renderPane() {
  const kids = [];
  if (S.view === "mit") kids.push(mitView());
  else if (!S.sel) kids.push(emptyState());
  else if (S.tab === "agent") {
    const x = ordered("agent").find(r => r.ref === S.sel);
    kids.push(...(x ? agentCard(x) : [emptyState()]));
  } else if (S.tab === "decided") {
    const x = ordered("decided").find(r => r.ref === S.sel);
    kids.push(...(x ? decidedCard(x) : [emptyState()]));
  } else {
    const c = cardByKey(S.sel);
    const vis = c.group ? mine(c) : [0];
    const kinds = [...new Set(vis.map(i => c.points[i].kind))].join(" · ");
    kids.push(meta(c, [kinds, c.blocks ? "blocks work" : null, S.back.has(c.ref) ? "with head" : null,
      c.final ? "final" : c.points.every(p => p.options.length) ? "reversible" : null]));
    kids.push(c.group ? groupCard(c) : singleCard(c));
  }
  $("inner").replaceChildren(...kids.filter(Boolean));
}

// The decide row sticks to the bottom of a long card; a shadow shows it floats over the content.
function markStuck() {
  const row = document.querySelector(".pane .decide"), pane = $("pane");
  if (!row) return;
  const card = row.closest(".card").getBoundingClientRect(), view = pane.getBoundingClientRect();
  row.classList.toggle("stuck", card.bottom > view.bottom + 1);
}
const TAB_LABEL = {open: "Open", decided: "Decided", agent: "Agent"};
function render() {
  $("app").classList.toggle("card-view", S.phoneCard);
  document.body.classList.toggle("card-view", S.phoneCard);
  $("hback").textContent = "‹ " + (S.view === "mit" ? "Back" : TAB_LABEL[S.tab]);
  renderNav(); renderList(); $("strips").replaceChildren(...[strip()].filter(Boolean)); renderPane(); markStuck();
}
$("pane").addEventListener("scroll", markStuck, {passive: true});
$("hback").addEventListener("click", () => { S.view = "card"; toList(); });
window.addEventListener("resize", markStuck);

// Hash parameters only open a given state for screenshots: tab, card, opt, pt, view, theme, panel, pick.
const q = new URLSearchParams(location.hash.slice(1));
if (q.get("theme")) document.documentElement.dataset.theme = q.get("theme");
if (q.get("tab")) S.tab = q.get("tab");
S.sel = q.get("card") || firstOf(S.tab);
if (q.get("card")) S.phoneCard = true;
if (q.get("view") === "mit") { S.view = "mit"; S.phoneCard = true; }
const selCard = S.tab === "open" && cardByKey(S.sel);
if (selCard && q.get("pt") !== null) S.openPt.set(selCard.ref, +q.get("pt"));
if (selCard && q.get("opt") !== null) {
  const pi = selCard.group ? (S.openPt.get(selCard.ref) ?? 0) : 0;
  S.openOpt.set(selCard.points[pi].ref, +q.get("opt"));
}
if (selCard && q.get("panel")) S.panel.set(selCard.ref, q.get("panel"));
render();

</script>
