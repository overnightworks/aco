[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "overnightworks-aco"
dynamic = ["version"]
description = "Repository-neutral GitHub issue claims for coding agents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "aco contributors"}]
dependencies = []

[project.scripts]
aco = "aco.cli:main"
aco-board = "aco.board.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The board's built assets are committed under src/aco/board/static/ so a
# Python-only install needs no Node; scripts/package_smoke.sh proves they ship.
[tool.setuptools.package-data]
"aco.board" = ["static/**"]

[tool.setuptools.dynamic]
version = {attr = "aco.__version__"}

# uv invalidates builds of path sources only via pyproject.toml's mtime by
# default, so `uv tool install --from .` can silently reinstall a cached wheel
# from an older commit (issue #70). Keying the cache on the git commit makes
# every landing invalidate it.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true } }]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The network guard loads from this configuration, not from tests/conftest.py,
# so a test module run from outside tests/ with this file is guarded too.
pythonpath = ["tests", "scripts"]
addopts = ["-p", "network_guard"]

[tool.coverage.run]
branch = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PL", "FURB", "N", "SLF001"]

[tool.ruff.lint.per-file-ignores]
# Test literals are scenario data, not domain magic numbers; a pytest test
# function's parameter list is shaped by fixture injection and
# `parametrize`, not a free design choice, so its argument count isn't a
# design smell the way a production function's is. This is a standing
# policy for fixture-shaped signatures, not a per-finding exception, so it
# stays a file-wide ignore rather than a line marker. Tests also inspect
# private owners and parser internals (SLF001) to pin what they guard.
"tests/**" = ["PLR2004", "PLR0913", "PLR0917", "SLF001"]

[tool.importlinter]
root_packages = ["aco"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
containers = ["aco"]
exhaustive = true
layers = [
    "cli",
    "cmd_adopt | cmd_ask | cmd_board | cmd_body | cmd_bootstrap | cmd_brief | cmd_check | cmd_claim | cmd_cut | cmd_item | cmd_land | cmd_next | cmd_release | cmd_rescope | cmd_reset | cmd_rule | cmd_rulings | cmd_start | cmd_status | cmd_workspace",
    "board_read | policy | report",
    "session",
    "workspace",
    "terminal",
    "providers",
    "checkout | store",
    "github | state_board",
    "forge",
    "workboard",
    "items",
    "body",
    "metrics",
    "protocol | process | board",
]
# `metrics` moved below `body` (issue #419): it has no `aco`
# import of its own, so nothing above
# depended on its old position ahead of `items`/`body` -- moving it lets
# `body` (the body-block codec) reach `metrics.Size` for its own
# `size`/`[[expectation]]` schema, while `items` may still import `body`,
# never the reverse.
# The seven cmd_* -> cmd_* edges: land.spec cites the release rules (#2, section 2);
# start.spec cites the claim rules CLM-05/06/18; adopt.spec ADOPT-14 cites CLM-18
# and CLAIM-31; brief.spec BRIEF-26 cites
# STAT-19..21 and BRIEF-10 cites STAT-22; item.spec ITEM-32/34 cite CUT-17/28
# and ITEM-33 cites CUT-29..31; ITEM-25 cites body --check (#2, manifest S18–S21);
# ask.spec ASK-09 cites rule.spec RULE-06..08.
ignore_imports = [
    "aco.cmd_adopt -> aco.cmd_claim",
    "aco.cmd_ask -> aco.cmd_rule",
    "aco.cmd_brief -> aco.cmd_status",
    "aco.cmd_item -> aco.cmd_body",
    "aco.cmd_item -> aco.cmd_cut",
    "aco.cmd_land -> aco.cmd_release",
    "aco.cmd_start -> aco.cmd_claim",
]

[[tool.importlinter.contracts]]
name = "Decision board layers"
type = "layers"
containers = ["aco.board"]
exhaustive = true
# Issue #617: the board's rules (`board`) know only the port, never the aco
# adapter; the two are independent neighbours that `cli` wires together, and
# the transport (`server`, `static`, `api`) reaches the rules only through
# `board`. `static` (the built SPA shell) and `api` (JSON wire form) are
# independent (issue #652).
layers = [
    "cli",
    "server",
    "api | static",
    "board | aco_cli",
    "ports",
]

[[tool.importlinter.contracts]]
name = "Decision board transport does not reach the aco adapter"
type = "forbidden"
# The layers contract alone lets `server`, `static`, and `api` import
# `aco_cli`, which sits below them; only `cli` may wire the adapter in
# (issue #617).
source_modules = ["aco.board.server", "aco.board.static", "aco.board.api"]
forbidden_modules = ["aco.board.aco_cli"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "aco does not import the decision board"
type = "protected"
# The Layers contract holds board -> core only one way (a sibling layer may
# import a layer above it); this contract holds core -> board and
# `aco/__init__` -> board, which a forbidden contract over overlapping source
# and forbidden sets would silently keep.
protected_modules = ["aco.board"]
allowed_importers = ["aco.board"]

[[tool.importlinter.contracts]]
name = "The decision board reaches aco only through its command line"
type = "forbidden"
# Issue #617: the board talks to aco through the installed `aco` CLI and its
# specified JSON, never through aco's internal modules.
# `as_packages = false` lists every module of the board as its own source, so
# the overlap with the forbidden `aco` package does not make the contract
# keep silently; it holds board -> `aco/__init__`.
source_modules = ["aco.board", "aco.board.**"]
forbidden_modules = ["aco"]
allow_indirect_imports = false
as_packages = false

[[tool.importlinter.contracts]]
name = "items does not import metrics"
type = "forbidden"
# The Layers contract above now places `metrics` below `items` (so `body`,
# also below `items`, can reach it), which would otherwise let `items`
# import `metrics` too -- a permission the layer order held before `body`
# existed and had no reason to grant. This contract keeps that narrower
# restriction on top of the wider layer order.
# true checks only the direct edge: items legitimately reaches metrics
# through the allowed items -> body -> metrics chain, so checking
# indirectly would flag that permitted chain along with a genuine direct
# items -> metrics import.
source_modules = ["aco.items"]
forbidden_modules = ["aco.metrics"]
allow_indirect_imports = true
as_packages = false

[[tool.importlinter.contracts]]
name = "The claim-state store is git transport only"
type = "forbidden"
source_modules = ["aco.store"]
forbidden_modules = [
    "aco.github",
    "aco.state_board",
    "aco.forge",
    "aco.workboard",
    "aco.items",
    "aco.checkout",
]
# false checks every chain, not only a direct import: store being "git
# transport only" is a full isolation boundary, so store reaching a
# forbidden module through an allowed intermediate (store -> some helper
# -> github) is exactly the coupling this contract exists to forbid.
allow_indirect_imports = false
as_packages = false

[[tool.importlinter.contracts]]
name = "Workspace recovery does not reach repository coordination"
type = "forbidden"
source_modules = [
    "aco.cmd_workspace",
    "aco.workspace",
    "aco.terminal",
    "aco.providers",
]
forbidden_modules = [
    "aco.store",
    "aco.checkout",
    "aco.github",
    "aco.state_board",
    "aco.forge",
    "aco.items",
]
allow_indirect_imports = false
as_packages = false

[[tool.importlinter.contracts]]
name = "Provider definitions do not drive workspace orchestration"
type = "forbidden"
source_modules = ["aco.providers"]
forbidden_modules = ["aco.workspace", "aco.terminal"]
allow_indirect_imports = false
as_packages = false

[[tool.importlinter.contracts]]
name = "Only the process boundary imports subprocess"
type = "forbidden"
# "aco.**" (recursive), not "aco.*": the
# single-level wildcard is blind to a subpackage's own submodules, so a
# future nested module could import subprocess unnoticed.
source_modules = ["aco", "aco.**"]
forbidden_modules = ["subprocess"]
# true checks only the direct edge: subprocess has no other module to
# reach it through, so the only "indirect" chain would be through another
# aco module that itself directly imports subprocess --
# checking indirectly would misattribute that module's violation to every
# caller along the chain instead of the module that actually wrote the
# import.
allow_indirect_imports = true
as_packages = false
# The decision board's one adapter calls the installed `aco` command line.
ignore_imports = ["aco.process -> subprocess", "aco.board.aco_cli -> subprocess"]

[[tool.importlinter.contracts]]
name = "Only the gh, git, and terminal owners run commands"
type = "forbidden"
source_modules = ["aco", "aco.**"]
forbidden_modules = ["aco.process"]
# true checks only the direct edge: many modules legitimately depend on an
# allowed process caller (github, checkout, store, terminal) further up
# their own chain, so checking indirectly would flag every one of those
# callers too instead of only the module that itself imports process.
allow_indirect_imports = true
as_packages = false
ignore_imports = [
    "aco.github -> aco.process",
    "aco.checkout -> aco.process",
    "aco.store -> aco.process",
    "aco.terminal -> aco.process",
]

[tool.pyright]
extraPaths = ["src", "scripts"]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "build>=1",
    "ruff==0.17.1",
    "vulture==2.16",
    "import-linter==2.15",
    "pyright==1.1.414",
    "pytest-xdist>=3.8.0",
]
