[gate]
mandatory_jobs = ["check (3.14)", "Package smoke (wheel, sdist, tool install without Node)", "Frontend (svelte-check, lint, knip, vitest, assets fresh)", "E2E (Playwright, desktop)"]
legacy = "fail"

[[gate.loosened]]
what = 'import contract "Layers" changes layers'
item = "#665"
date = 2026-11-06
reason = "aco.metrics leaves with the size statistics, so the row that held it beside expectation_grammar loses it"

[[gate.loosened]]
what = 'import contract "items does not import metrics" removed'
item = "#665"
date = 2026-11-06
reason = "the contract forbade items to import aco.metrics, a module that no longer exists"

[[gate.loosened]]
what = 'import contract "Only the gh and git owners run commands" ignores aco.state_export -> aco.process'
item = "#976"
date = 2026-11-19
reason = "the bundle export moves out of aco.store with the git failure-detail readers it already called, so the module that owns the export becomes a process caller"

[[root.allow]]
entry = "frontend/"
reason = "the web client, built apart from the Python package"

[[root.allow]]
entry = "specs/"
reason = "the command specs that own each command's behaviour and printed literals"

[[layout.allow]]
path = "tests/test_network_guard.py"
rule = "test-layout"
reason = "tests the suite's own network guard plugin (tests/support/network_guard.py), which no src/aco module owns"
