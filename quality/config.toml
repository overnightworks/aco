[gate]
mandatory_jobs = ["check (3.14)", "Package smoke (wheel, sdist, tool install without Node)", "Frontend (svelte-check, lint, knip, vitest, assets fresh)", "E2E (Playwright, desktop)"]
legacy = "fail"

[[gate.loosened]]
what = 'import contract "Layers" changes layers'
item = "#1115"
date = 2026-11-26
reason = "cmd_board leaves the command row for its own row below it, so cmd_mcp may import the board projection read_startable reuses"

[[gate.loosened]]
what = 'import contract "items does not import metrics" removed'
item = "#665"
date = 2026-11-06
reason = "the contract forbade items to import aco.metrics, a module that no longer exists"

[[gate.loosened]]
what = 'import contract "Decision board layers" changes layers'
item = "#1027"
date = 2026-11-21
reason = "the token file moves out of aco.board to aco.board_token so core's board link producer may read it, so the row that held token_store beside board and aco_source loses it"

[[gate.loosened]]
what = 'import contract "Only the gh and git owners run commands" ignores aco.mcp_relay -> aco.process'
item = "#1042"
date = 2026-11-22
reason = "mcp_relay starts aco's own fresh `aco mcp --direct` process, never gh or git"

[[root.allow]]
entry = "frontend/"
reason = "the web client, built apart from the Python package"

[[root.allow]]
entry = "specs/"
reason = "the command specs that own each command's behaviour and printed literals"

[[layout.allow]]
path = "tests/test_network_guard.py"
rule = "test-layout"
reason = "tests the suite's own network guard plugin (tests/support/network_guard.py), which no src/aco module owns"

[[size.generated]]
path = "src/aco/board/static/assets/index.js"
job = "Frontend (svelte-check, lint, knip, vitest, assets fresh)"
item = "#1058"
date = 2026-11-23
reason = "the built board bundle, rebuilt by pnpm --dir frontend build and proven by the step Assets fresh"
