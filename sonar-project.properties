sonar.organization=overnightworks
sonar.projectKey=overnightworks_aco
sonar.projectName=aco

sonar.sources=src,frontend/src
# 04.10.2026 (decision board #13): the JS/TS sensor silently skips .svelte
# files, so a component's own behaviour must live in frontend/src/app/model
# (pure) and frontend/src/app/state (runtime state) to be analysed at all; a
# .svelte file stays thin markup over those.
sonar.tests=tests,frontend
# frontend/ is both a source and a test root: the inclusions below make
# *.test.ts count as tests, and the same mask in sonar.exclusions keeps them
# from being indexed a second time as sources (sonar.exclusions applies to
# sources only). The test helpers are tests too, and so are the E2E specs
# (frontend/e2e), which lie outside the source roots and need no exclusion.
# The built board assets under src/aco/board/static are a generated copy of
# frontend/src and are not analysed twice.
sonar.test.inclusions=tests/**,frontend/src/**/*.test.ts,frontend/src/test-support/**,frontend/src/test-setup.ts,frontend/e2e/**
sonar.exclusions=src/aco/board/static/**,frontend/src/**/*.test.ts,frontend/src/test-support/**,frontend/src/test-setup.ts
sonar.python.version=3.11,3.12,3.13
sonar.python.coverage.reportPaths=coverage.xml
